[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wakako"
version = "0.1.0"
description = "Wakako: Google Search Console + Analytics from the command line, built for AI agents (personal-account OAuth)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "google-auth>=2.29",
  "google-auth-oauthlib>=1.2",
  "google-api-python-client>=2.120",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wakako = "wakako.cli:app"
gsc = "wakako.cli:app"  # short alias

[tool.hatch.build.targets.wheel]
packages = ["src/wakako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
